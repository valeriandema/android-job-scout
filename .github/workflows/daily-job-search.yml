name: Daily Android Job Scout

on:
  schedule:
    # 08:00 UTC daily — 10:00 or 11:00 Europe/Sofia depending on DST
    - cron: "0 8 * * *"
  workflow_dispatch: {}      # allow manual trigger from the Actions tab

permissions:
  contents: write            # needed so the job can commit updated data/seen.json

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
        run: |
          python -m src.main

      - name: Commit updated seen-state
        if: always()
        run: |
          git config user.name  "android-job-scout[bot]"
          git config user.email "android-job-scout[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/seen.json)" ]; then
            git add data/seen.json
            git commit -m "chore: update seen-jobs state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
